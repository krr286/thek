name: THEK Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          path: main
          fetch-depth: 0

      - name: Checkout vpn-service
        uses: actions/checkout@v4
        with:
          repository: KaringX/vpn-service
          path: vpn-service

      - name: Checkout webdav_client
        uses: actions/checkout@v4
        with:
          repository: KaringX/webdav_client
          path: webdav_client

      - name: Checkout android_package_manager
        uses: actions/checkout@v4
        with:
          repository: KaringX/android_package_manager
          path: android_package_manager

      - name: Checkout move_to_background
        uses: actions/checkout@v4
        with:
          repository: KaringX/move_to_background
          path: move_to_background

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: main
        run: flutter pub get

      - name: Build APK
        working-directory: main
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: thek-apk
          path: main/build/app/outputs/flutter-apk/app-release.apk
